<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Style-Type" content="text/css">
    <title>Email</title>

</head>
<body>
    <center>
        <div style="background-color:#ffffff;padding: 25px;">

            <div><p>&nbsp;</p></div>

            <table class="table" style="width:60%;border:2px;border-color:black;border-style:solid">
                <tbody>
                    <tr>
                        <td colspan="3" style="width:6.65in;border:solid windowtext 1.0pt;padding:0in 5.4pt 0in 5.4pt" valign="top" width="638">
                            <p style="text-align:center" align="center">
                                <span style="font-size:20.0pt">
                                    Production Summary of batch "<%FileName%>" on <%yyyymmdd%> at <%hhmm%>
                                    <u></u><u></u>
                                </span>
                            </p>
                        </td>
                    </tr>
                    <tr>
					 <td style="width:10%;border:solid windowtext 1.0pt;border-top:none;padding:0in 5.4pt 0in 5.4pt" valign="top" width="213">
                            <p><b>Sr. No.<u></u><u></u></b></p>
                        </td>
                        <td style="width:80%;border-top:none;border-left:none;border-bottom:solid windowtext 1.0pt;border-right:solid windowtext 1.0pt;padding:0in 5.4pt 0in 5.4pt" valign="top" width="213">
                            <p><b>Description<u></u><u></u></b></p>
                        </td>
                        <td style="width:10%;border-top:none;border-left:none;border-bottom:solid windowtext 1.0pt;border-right:solid windowtext 1.0pt;padding:0in 5.4pt 0in 5.4pt" valign="top" width="213">
                            <p><b>Count<u></u><u></u></b></p>
                        </td>
                    </tr>
                    <%trdata%>
                    <tr>
                        <td colspan="3" style="width:6.65in;border:solid windowtext 1.0pt;border-top:none;padding:0in 5.4pt 0in 5.4pt" valign="top" width="638">
                            <p style="text-align:center" align="center"><span style="font-size:9.0pt">We will ship generated documents of this batch.<u></u><u></u></span></p>
                        </td>
                    </tr>
					
                </tbody>
            </table>
        </div>
    </center>
</body>
</html>
