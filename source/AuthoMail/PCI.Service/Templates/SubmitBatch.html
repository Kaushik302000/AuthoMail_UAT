<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Style-Type" content="text/css">
    <title>Batch Submitted To PCI</title>
</head>
<body>
    <center>
        <div style="background-color:#ffffff;padding: 25px;">

            <div><p>&nbsp;</p></div>

            <table class="table" style="width:60%;border:2px;border-color:black;border-style:solid">
                <tbody>
                    <tr>
                        <td colspan="3" style="width:6.65in;border:solid windowtext 1.0pt;padding:0in 5.4pt 0in 5.4pt" valign="top" width="638">
                            <p style="text-align:center" align="center">
                                <span style="font-size:20.0pt">
                                    Batch submitted to <%PrintLocation%> : "<%FileName%>" on <%yyyymmdd%> at <%hhmm%>
                                    <u></u><u></u>
                                </span>
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="width:6.65in;border:solid windowtext 1.0pt;padding:0in 6pt 0in 6pt;text-align:center;font-size:14.0pt" valign="top" width="638">Total Files</td>
                        <td style="width:6.65in;border:solid windowtext 1.0pt;padding:0in 6pt 0in 6pt;text-align:center;font-size:14.0pt" valign="top" width="638">Total Page Count</td>
                    </tr>
                    <tr>
                        <td>
                            <p style="text-align:center" align="center">
                                <span style="font-size:14.0pt"><%TotalMailPieces%></span>
                            </p>
                        </td>
                        <td>
                            <p style="text-align:center" align="center">
                                <span style="font-size:14.0pt"><%TotalPageCount%></span>
                            </p>

                        </td>
                    </tr>
                    <tr>
                        <td colspan="3" style="width:6.65in;border:solid windowtext 1.0pt;border-top:none;padding:0in 5.4pt 0in 5.4pt" valign="top" width="638">
                            <p style="text-align:center" align="center"><span style="font-size:9.0pt">If you face any trouble please contact to us on brpatel@corelogic.com<u></u><u></u></span></p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </center>
</body>
</html>
